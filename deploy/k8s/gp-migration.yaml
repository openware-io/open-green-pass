apiVersion: batch/v1
kind: Job
metadata:
  name: gp-migrate-VERSION_NAME
  namespace: gp
  labels: { app.kubernetes.io/part-of: greenpass, app.kubernetes.io/component: migration }
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata: { labels: { app.kubernetes.io/part-of: greenpass, app.kubernetes.io/component: migration } }
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: IMAGE_REGISTRY/open-green-pass-migrate:VERSION
          imagePullPolicy: IMAGE_PULL_POLICY
          command: ["/usr/local/bin/gp-migrate"]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          envFrom: [{ secretRef: { name: gp-app-config } }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 100m, memory: 128Mi } }
