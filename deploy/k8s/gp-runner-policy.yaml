# GP0-03 软隔离策略：gp-runner 仅能访问 GP 控制面和已批准的 SUT 入口。
# gp 命名空间的 ingress NetworkPolicy 由 deploy/k8s/gp-app.yaml 管理。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gp-runner-allow-gp
  namespace: gp-runner
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp
---
# Runner 默认拒绝出站；仅放行集群 DNS、GP 控制面和经批准的 SUT 入口。
# open-im-local 是首个被测对象：只允许其 gateway 的 3002/TCP，绝不放开
# 整个命名空间或修改 SUT 任一工作负载。后续真实用例若必须绕过 gateway，
# 必须在此处逐服务、逐端口审查后补充。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gp-runner-egress-default-deny
  namespace: gp-runner
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gp
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 7233
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: open-im-local
          podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 3002
---
# Runner sandbox capacity is independently bounded so pathological test jobs
# cannot consume capacity reserved for either the GP control plane or IM SUT.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gp-runner-quota
  namespace: gp-runner
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    count/jobs.batch: "10"
    count/pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: gp-runner-limitrange
  namespace: gp-runner
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi
      min:
        cpu: 25m
        memory: 32Mi
