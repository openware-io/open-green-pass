# Credentials are supplied by an existing Secret named gp-postgres-auth.
# This manifest intentionally contains no password and only targets namespace gp.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gp-postgres-data
  namespace: gp
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gp-postgres
  namespace: gp
spec:
  replicas: 1
  selector:
    matchLabels: { app: gp-postgres }
  template:
    metadata:
      labels: { app: gp-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: gp-postgres-auth, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: gp-postgres-auth, key: password } }
            - name: POSTGRES_DB
              value: gp
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gp-postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: gp-postgres
  namespace: gp
spec:
  type: ClusterIP
  selector: { app: gp-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
