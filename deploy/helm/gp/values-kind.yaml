# Development-only values for the isolated kind GreenPass release.
# The image is deliberately tagged with the Git release tag and loaded into
# kind before Helm upgrade; it is never a replacement for a registry release.
namespaceOverride: gp

secrets:
  existingSecret: gp-app-config

# Run the immutable migration image before every controlled Helm upgrade.
# The hook is the single schema-upgrade path for the kind environment.
migration:
  enabled: true
  image:
    repository: ghcr.io/openware-io/open-green-pass-migrate
    tag: 0.1.25-SNAPSHOT
    pullPolicy: Never
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }

server:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/openware-io/open-green-pass
    tag: 0.1.25-SNAPSHOT
    pullPolicy: Never
  env:
    GP_ADDR: ":8080"
    GP_ENV: dev
    GP_ALLOW_HEADER_AUTH: "true"
    GP_BUILD_REVISION: "0.1.25-SNAPSHOT"
    GP_RUNNER_TYPE: k8s
    GP_RUNNER_NS: gp-runner
    GP_RUNNER_IMAGE: curlimages/curl:8.10.1
    GP_MODEL_SECRET_NAMESPACE: gp
    GP_AUTH_SECRET_NAMESPACE: gp
    GP_TEMPORAL_ADDR: gp-temporal-frontend.gp.svc.cluster.local:7233
    GP_QUOTA_RUN_GLOBAL: "50"
    GP_QUOTA_RUN_TEAM: "20"
    GP_QUOTA_RUN_TARGET: "5"
    GP_QUOTA_RUN_OWNER: "3"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

worker:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/openware-io/open-green-pass
    tag: 0.1.25-SNAPSHOT
    pullPolicy: Never
  env:
    GP_CICD_PROVIDER: ""
    GP_CICD_WEBHOOK_URL: ""
    GP_CICD_MAX_ATTEMPTS: "5"
    GP_CICD_RETRY_BASE_SECONDS: "5"
    GP_CICD_CLAIM_TIMEOUT_SECONDS: "120"
    GP_ENV: dev
    GP_ALLOW_HEADER_AUTH: "true"
    GP_BUILD_REVISION: "0.1.25-SNAPSHOT"
    GP_RUNNER_TYPE: k8s
    GP_RUNNER_NS: gp-runner
    GP_RUNNER_IMAGE: curlimages/curl:8.10.1
    GP_TEMPORAL_ADDR: gp-temporal-frontend.gp.svc.cluster.local:7233
    GP_QUOTA_RUN_GLOBAL: "50"
    GP_QUOTA_RUN_TEAM: "20"
    GP_QUOTA_RUN_TARGET: "5"
    GP_QUOTA_RUN_OWNER: "3"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

web:
  enabled: true
  image:
    repository: ghcr.io/openware-io/open-green-pass-web
    tag: 0.1.25-SNAPSHOT
    pullPolicy: Never
  env:
    VITE_GP_API_BASE: /api
    VITE_GP_TEAM_ID: "1001"
    VITE_GP_USER_ID: "42"
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }

networkPolicy:
  enabled: true

ingress:
  enabled: true
  className: nginx
  hosts:
    # Dedicated loopback hostname. It prevents GreenPass '/' and '/api'
    # routes from colliding with the co-hosted open-im-local Ingress.
    - host: greenpass.localhost

resources:
  quota:
    enabled: true
  limitRange:
    enabled: true
