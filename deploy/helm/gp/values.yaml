namespaceOverride: gp

imagePullSecrets: []

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  name: gp-controller

secrets:
  existingSecret: ""

migration:
  enabled: false
  image:
    repository: ghcr.io/openware-io/open-green-pass-migrate
    tag: ""
    pullPolicy: IfNotPresent
  env: {}
  resources: {}

server:
  enabled: false
  image:
    repository: ghcr.io/openware-io/open-green-pass
    tag: ""
    pullPolicy: IfNotPresent
  command: []
  args: []
  replicas: 1
  env: {}
  resources: {}

worker:
  enabled: false
  image:
    # Server and worker are built from the same signed release image. The
    # explicit command selects the worker binary copied into that image.
    repository: ghcr.io/openware-io/open-green-pass
    tag: ""
    pullPolicy: IfNotPresent
  command: ["/usr/local/bin/gp-worker"]
  args: []
  replicas: 1
  env: {}
  resources: {}

web:
  enabled: false
  image:
    repository: ghcr.io/openware-io/open-green-pass-web
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  env:
    VITE_GP_API_BASE: /api
    VITE_GP_TEAM_ID: "1001"
    VITE_GP_USER_ID: "42"
  resources: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  hosts: []

resources:
  quota:
    enabled: true
    requestsCpu: "8"
    requestsMemory: 16Gi
    limitsCpu: "16"
    limitsMemory: 32Gi
    pods: "50"
    pvc: "40"
  limitRange:
    enabled: true

networkPolicy:
  enabled: true
