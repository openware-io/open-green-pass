apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gp.fullname" . }}-managed-secrets
  namespace: {{ .Values.namespaceOverride }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gp.fullname" . }}-managed-secrets
  namespace: {{ .Values.namespaceOverride }}
subjects:
  {{- $serviceAccount := .Values.serviceAccount | default dict }}
  - kind: ServiceAccount
    name: {{ default "gp-controller" (get $serviceAccount "name") }}
    namespace: {{ .Values.namespaceOverride }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gp.fullname" . }}-managed-secrets
