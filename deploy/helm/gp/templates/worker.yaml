{{- if .Values.worker.enabled }}
{{- $serviceAccount := .Values.serviceAccount | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gp-worker
  namespace: {{ .Values.namespaceOverride }}
  labels:
    {{- include "gp.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gp.name" . }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "gp.name" . }}
        app.kubernetes.io/part-of: greenpass
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ default "gp-controller" (get $serviceAccount "name") }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ required "worker.image.tag is required when worker.enabled=true" .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          {{- with .Values.worker.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.worker.args }}
          args: {{ toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          env:
            {{- range $name, $value := .Values.worker.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if .Values.secrets.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
          {{- end }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
{{- end }}
