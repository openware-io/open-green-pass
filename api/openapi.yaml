openapi: 3.0.3
info:
  title: GreenPass 软件测试治理平台 API
  description: |
    测试质量管控平台后端契约（P1）。
    租户隔离：所有业务请求必须携带 `x-gp-team-id` 与可选 `x-gp-user-id` 头，经 RLS 过滤。
    审计哈希链 / 成本明细 / 门禁判定由 trusted 域统一写（口径单点）。
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /generation/runs:
    get:
      summary: 查询项目的生成任务
      operationId: listGenerationRuns
      parameters: [ { name: project_id, in: query, required: true, schema: { type: integer } }, { name: limit, in: query, schema: { type: integer } } ]
      responses:
        '200': { description: 生成任务列表, content: { application/json: { schema: { type: array, items: { type: object } } } } }
    post:
      summary: 创建一次生成任务
      operationId: createGenerationRun
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [project_id, scope_type, scope_id, idempotency_key, units], properties: { project_id: { type: integer }, scope_type: { type: string, enum: [project, repo, service] }, scope_id: { type: integer }, idempotency_key: { type: string }, units: { type: array, items: { type: object } } } } } }
      responses:
        '202': { description: 已创建, content: { application/json: { schema: { type: object } } } }
  /generation/runs/{id}:
    get:
      summary: 查询生成任务进度
      operationId: getGenerationRun
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: 生成任务, content: { application/json: { schema: { type: object } } } }
  /generation/runs/{id}/cancel:
    post:
      summary: 取消整个生成任务
      operationId: cancelGenerationRun
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: 已取消, content: { application/json: { schema: { type: object } } } }
  /generation/batches:
    get:
      summary: 查询当前项目最近的用例生成批次
      description: 仅返回当前租户和指定项目的批次，按创建时间降序排列，同一时间按 ID 降序排列。
      parameters:
        - { name: target_id, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: 生成批次列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GenerationBatch' } } } } }
        '400': { description: 缺少租户或项目 ID、查询参数无效 }
    post:
      summary: 创建用例生成批次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationBatchCreate'
      responses:
        '202': { description: 批次已创建, content: { application/json: { schema: { $ref: '#/components/schemas/GenerationBatch' } } } }
        '200': { description: 幂等返回已有批次, content: { application/json: { schema: { $ref: '#/components/schemas/GenerationBatch' } } } }
  /generation/batches/{id}:
    get:
      summary: 查询用例生成批次
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200': { description: 批次状态, content: { application/json: { schema: { $ref: '#/components/schemas/GenerationBatch' } } } }
  /generation/batches/{id}/cancel:
    post:
      summary: 取消生成批次并清理临时候选
      operationId: cancelGenerationBatch
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ expected_state_version, request_id ], properties: { expected_state_version: { type: integer, format: int64 }, request_id: { type: string } } } } }
      responses:
        '200': { description: 已取消, content: { application/json: { schema: { $ref: '#/components/schemas/GenerationBatch' } } } }
  /generation/batches/{id}/seeds:
    get:
      summary: 查询候选用例种子
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200': { description: 候选种子, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GenerationSeed' } } } } }
  /generation/batches/{id}/review:
    post:
      summary: 审核用例生成批次
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GenerationReview' } } }
      responses:
        '200': { description: 审核完成, content: { application/json: { schema: { $ref: '#/components/schemas/GenerationBatch' } } } }
  /projects/{id}/repositories/{repoID}/refs:
    get:
      summary: 查询已同步的仓库分支与 Tag
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: repoID, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 代码引用, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RepositoryRef' } } } } }
  /projects/{id}/repositories/{repoID}/refs:refresh:
    post:
      summary: 刷新仓库分支与 Tag
      description: 由服务端源码连接器读取，客户端不能提交 Git 命令或任意引用。
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: repoID, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 刷新后的代码引用, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RepositoryRef' } } } } }
  /scm-connections:
    get:
      summary: 查询团队源码读取连接（不返回凭据）
      responses:
        '200': { description: 源码连接列表, content: { application/json: { schema: { type: object, required: [ connections ], properties: { connections: { type: array, items: { $ref: '#/components/schemas/SCMConnection' } } } } } } }
    post:
      summary: 验证并保存 GitHub 只读连接
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SCMConnectionInput' } } }
      responses:
        '201': { description: 已验证并保存, content: { application/json: { schema: { $ref: '#/components/schemas/SCMConnection' } } } }
        '502': { description: GitHub 凭据验证失败 }
  /scm-connections/github-app:
    get:
      summary: 查询 GitHub App 是否已由平台管理员配置
      responses:
        '200': { description: GitHub App 配置状态 }
        '409': { description: 尚未配置 }
  /scm-connections/github-app/authorize:
    post:
      summary: 获取 GitHub App 安装授权跳转
      responses:
        '200': { description: GitHub App 安装授权地址, content: { application/json: { schema: { type: object, required: [ authorization_url ], properties: { authorization_url: { type: string, format: uri } } } } } }
  /scm-connections/github-app/callback:
    get:
      summary: GitHub App 安装 Setup URL 回调，转入用户授权校验
      parameters: [ { name: installation_id, in: query, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '303': { description: 前往 GitHub 用户授权 }
  /scm-connections/github-app/oauth-callback:
    get:
      summary: GitHub App 用户授权回调，校验安装归属并保存连接
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string, minLength: 32 } }
      responses:
        '303': { description: 返回被测对象页 }
  /scm-connections/{id}:
    delete:
      summary: 删除源码读取连接并解除仓库绑定
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '204': { description: 已删除 }
        '404': { description: 连接不存在 }
  /scm-connections/{id}/rotate:
    post:
      summary: 轮换 PAT 源码读取连接凭据
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SCMConnectionRotateInput' }
      responses:
        '200': { description: 已轮换, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '409': { description: GitHub App 连接不支持直接轮换 }
        '422': { description: 新 Token 未通过只读验证 }
  /scm-connections/{id}/verify:
    post:
      summary: 重新验证源码读取连接
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200': { description: 已验证, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
  /projects/{id}/repositories/{repoID}/scm-connection:
    patch:
      summary: 为仓库绑定团队源码读取连接
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: repoID, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ scm_connection_id ], properties: { scm_connection_id: { type: integer, format: int64 } } } } }
      responses:
        '200': { description: 已绑定, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
  /healthz:
    get:
      summary: 健康检查
      operationId: healthz
      responses:
        '200':
          description: 存活
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /readyz:
    get:
      summary: 就绪检查
      operationId: readyz
      responses:
        '200':
          description: 依赖可用
          content:
            application/json: { schema: { $ref: '#/components/schemas/ReadinessResponse' } }
        '503':
          description: 依赖不可用
          content:
            application/json: { schema: { $ref: '#/components/schemas/ReadinessResponse' } }
  /version:
    get:
      summary: 构建和 API 版本
      operationId: version
      responses:
        '200':
          description: 版本信息
          content:
            application/json: { schema: { $ref: '#/components/schemas/VersionResponse' } }
  /teams/current:
    get:
      summary: 当前登录会话的团队概览
      operationId: currentTeam
      responses:
        '200': { description: 团队概览, content: { application/json: { schema: { $ref: '#/components/schemas/TeamSummary' } } } }
  /auth/wechat/status:
    get:
      summary: 微信登录公开配置状态
      operationId: wechatAuthStatus
      parameters:
        - { name: team_id, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 状态, content: { application/json: { schema: { type: object, required: [configured, enabled], properties: { configured: {type: boolean}, enabled: {type: boolean} } } } } }
  /settings/auth/wechat:
    get:
      summary: 获取微信登录配置
      operationId: getWechatAuthConfig
      responses:
        '200': { description: 配置, content: { application/json: { schema: { $ref: '#/components/schemas/WechatAuthConfig' } } } }
    put:
      summary: 保存微信登录配置
      operationId: saveWechatAuthConfig
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WechatAuthConfigInput' } } } }
      responses:
        '200': { description: 已配置, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
  /account/wechat:
    get:
      summary: 当前账号微信绑定状态
      operationId: getWechatBinding
      responses:
        '200': { description: 绑定状态, content: { application/json: { schema: { $ref: '#/components/schemas/WechatBinding' } } } }
    delete:
      summary: 解绑当前账号微信
      operationId: unbindWechat
      responses:
        '204': { description: 已解绑 }
  /teams/current/members:
    get:
      summary: 当前团队成员
      operationId: listTeamMembers
      responses:
        '200': { description: 成员列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TeamMember' } } } } }
  /teams/current/members/{id}:
    patch:
      summary: 修改当前团队成员角色或状态
      operationId: updateTeamMember
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TeamMemberUpdate' } } } }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '409': { description: 不能降级或停用最后一个拥有者 }
  /teams/current/assets:
    get:
      summary: 当前团队被测对象
      operationId: listTeamAssets
      responses:
        '200': { description: 被测对象列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TeamAsset' } } } } }
  /teams/current/assets/{targetId}/permissions:
    get:
      summary: 被测对象的成员授权
      operationId: listAssetPermissions
      parameters:
        - { name: targetId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 授权列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AssetGrant' } } } } }
  /teams/current/assets/{targetId}/permissions/{memberId}:
    put:
      summary: 设置成员的被测对象权限及配额
      operationId: updateAssetPermission
      parameters:
        - { name: targetId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: memberId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssetGrantUpdate' } } } }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/AssetGrant' } } } }
  # ---------- 被测对象（governance，GP1-01） ----------
  /targets:
    get:
      summary: 被测对象树（工程/服务组/服务/模块）
      operationId: listTargets
      parameters:
        - { name: x-gp-team-id, in: header, required: true, schema: { type: integer } }
      responses:
        '200': { description: 树形列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Target' } } } } }
    post:
      summary: 创建被测对象节点
      operationId: createTarget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name, type ]
              properties:
                name: { type: string }
                remark: { type: string, maxLength: 500 }
                type: { type: string, enum: [ project, service_group, service, module ] }
                parent_id: { type: integer }
                kind: { type: string }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/Target' } } } }
  /targets/{id}/repo:
    post:
      summary: 关联上游仓库（来源溯源）
      operationId: attachRepo
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ url ]
              properties:
                url: { type: string, description: 仓库地址（如 git@github.com:org/repo.git） }
                default_branch: { type: string }
      responses:
        '200': { description: 已关联, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
  /projects/{id}/repositories:
    get:
      summary: 列出项目仓库
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200': { description: 项目仓库, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProjectRepository' } } } } }
  /projects/{id}/repositories:batch:
    post:
      summary: 批量添加项目仓库
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ repositories ], properties: { repositories: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ProjectRepositoryInput' } } } } } }
      responses:
        '207': { description: 逐条处理结果, content: { application/json: { schema: { $ref: '#/components/schemas/BatchResultResponse' } } } }
  /projects/{id}/services:
    get:
      summary: 列出项目目录子服务
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200': { description: 子服务, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProjectService' } } } } }
  /projects/{id}/services:batch:
    post:
      summary: 按仓库目录批量创建子服务
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ services ], properties: { services: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ProjectServiceInput' } } } } } }
      responses:
        '207': { description: 逐条处理结果, content: { application/json: { schema: { $ref: '#/components/schemas/BatchResultResponse' } } } }
  /projects/{id}/services/{serviceId}:
    patch:
      summary: 修改目录子服务类型或确认生效
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: serviceId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { kind: { type: string, enum: [ api_service, gateway, websocket_service, web_app, mobile_app, desktop_app, other ] }, generation_status: { type: string, enum: [ pending, confirmed ] } } } } }
      responses:
        '200': { description: 已修改, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
  /targets/{id}/model-binding:
    get:
      summary: 查询被测对象模型绑定
      operationId: getModelBinding
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 模型绑定（未配置时为 null）, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ModelBinding' } ], nullable: true } } } }
    put:
      summary: 设置被测对象模型绑定
      operationId: setModelBinding
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelBinding' }
      responses:
        '200': { description: 已设置, content: { application/json: { schema: { $ref: '#/components/schemas/Target' } } } }
  /model-catalog:
    get:
      summary: 查询供应商默认配置与团队已配置模型（模型 ID 来自供应商官方 /models）
      responses:
        '200': { description: 模型目录, content: { application/json: { schema: { $ref: '#/components/schemas/ModelCatalog' } } } }
  /model-provider-models:
    post:
      summary: 读取供应商官方模型列表（不持久化）
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ModelProviderModelsInput' } } }
      responses:
        '200': { description: 官方模型列表, content: { application/json: { schema: { $ref: '#/components/schemas/ModelProviderModelsResponse' } } } }
        '502': { description: 供应商连接失败 }
  /model-connections:
    post:
      summary: 验证并保存团队模型连接（模型必须在供应商官方列表中）
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ModelConnectionInput' } } }
      responses:
        '200': { description: 已验证并保存, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '502': { description: 供应商连接失败 }
  # ---------- 用例（governance，GP1-02） ----------
  /cases:
    get:
      summary: 用例列表
      operationId: listCases
      parameters:
        - { name: x-gp-team-id, in: header, required: true, schema: { type: integer } }
        - { name: target_id, in: query, schema: { type: integer } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: 用例列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TestCase' } } } } }
    post:
      summary: 创建用例（版本化首版）
      operationId: createCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ target_id, code, title ]
              properties:
                target_id: { type: integer }
                code: { type: string }
                title: { type: string }
                kind: { type: string }
                script: { description: 用例脚本/数据（执行产物来源） }
      responses:
        '201': { description: 已创建（含版本）, content: { application/json: { schema: { $ref: '#/components/schemas/TestCase' } } } }
  /cases/{id}/versions:
    post:
      summary: 迭代创建用例新版本
      operationId: createCaseVersion
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ script ]
              properties:
                script: { description: 用例脚本/数据 }
                source_repo_id: { type: integer }
                source_branch: { type: string }
      responses:
        '200': { description: 新版本已创建, content: { application/json: { schema: { $ref: '#/components/schemas/TestCase' } } } }
  /cases/{id}/rollback:
    post:
      summary: 用例按版本回退（避免错误分支生成）
      operationId: rollbackCase
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ version ]
              properties:
                version: { type: integer }
      responses:
        '200': { description: 已回退 }
  /cases/{id}/history:
    get:
      summary: 用例版本历史对比
      operationId: caseHistory
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 版本历史, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CaseVersion' } } } } }
  /cases/{id}:
    delete:
      summary: 删除用例
      operationId: deleteCase
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 已删除, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
  # ---------- 版本校验（execution，GP1-03） ----------
  /targets/{id}/env/runtime:
    get:
      summary: 查询已登记的测试环境参数
      operationId: getRuntime
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: env, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 已登记, content: { application/json: { schema: { $ref: '#/components/schemas/EnvRuntime' } } } }
    post:
      summary: 登记测试环境运行版本（env_runtime）
      operationId: registerRuntime
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ env, version ]
              properties:
                env: { type: string }
                version: { type: string }
                base_url: { type: string, description: 管理员登记的测试环境 HTTP(S) origin }
                requirements: { type: array, items: { $ref: '#/components/schemas/EnvironmentRequirement' } }
                confirmation: { $ref: '#/components/schemas/EnvironmentConfirmation' }
      responses:
        '200': { description: 已登记, content: { application/json: { schema: { $ref: '#/components/schemas/EnvRuntime' } } } }
  /targets/{id}/version-check:
    post:
      summary: 发起版本校验（match/mismatch/unknown）
      operationId: checkVersion
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ env, target_version ]
              properties:
                env: { type: string }
                target_version: { type: string }
      responses:
        '200': { description: 校验结果（mismatch 阻断信号）, content: { application/json: { schema: { $ref: '#/components/schemas/EnvCheck' } } } }
  /targets/{id}/version-checks:
    get:
      summary: 最近版本校验记录
      operationId: recentChecks
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: 记录列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EnvCheck' } } } } }
  # ---------- 运行编排（execution，GP1-04） ----------
  /runs:
    get:
      summary: 测试运行列表
      operationId: listRuns
      parameters:
        - { name: target_id, in: query, schema: { type: integer } }
        - { name: state, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: 运行列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Run' } } } } }
    post:
      summary: 创建测试运行（勾选用例空=全量）
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ target_id, scenario_id, target_version ]
              properties:
                target_id: { type: integer }
                scenario_id: { type: integer }
                env: { type: string }
                target_version: { type: string }
                target_branch: { type: string }
                selected_case_ids: { type: array, items: { type: integer }, description: 空=全量 }
      responses:
        '201': { description: 已创建（queued）, content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } } }
  /runs/{id}:
    get:
      summary: 运行详情（状态机）
      operationId: getRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 运行聚合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
  /runs/{id}/events:
    get:
      summary: 运行状态 SSE 事件流
      operationId: runEvents
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 运行状态事件流；每条 data 为 Run
          content:
            text/event-stream:
              schema: { type: string }
  /runs/{id}/case-results:
    get:
      summary: 运行内用例结果
      operationId: runCaseResults
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 用例结果列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CaseResult' } } } } }
  /runs/{id}/fixtures:prepare:
    post:
      summary: 准备本次 run 的 fixture 命名空间
      operationId: prepareRunFixture
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FixturePrepare' } } }
      responses:
        '201': { description: fixture, content: { application/json: { schema: { $ref: '#/components/schemas/RunFixture' } } } }
  /runs/{id}/fixtures:
    get:
      summary: 查询 run fixtures
      operationId: listRunFixtures
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: fixtures, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RunFixture' } } } } }
  /runs/{id}/fixtures:cleanup:
    post:
      summary: 清理 run fixtures
      operationId: cleanupRunFixtures
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { namespace: { type: string } } } } } }
      responses:
        '200': { description: cleaned, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
  /envs/{id}/lease:
    post:
      summary: 获取环境租约
      operationId: leaseEnvironment
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EnvLeaseCreate' } } }
      responses:
        '201': { description: lease, content: { application/json: { schema: { $ref: '#/components/schemas/EnvLease' } } } }
    delete:
      summary: 释放环境租约
      operationId: releaseEnvironment
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: released, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
  /runs/{id}/coverage-sync:
    post:
      summary: 回写运行结果到覆盖账本
      operationId: syncRunCoverage
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: 更新数量, content: { application/json: { schema: { type: object, required: [ updated ], properties: { updated: { type: integer } } } } } }
  /runs/{id}/triage:
    post:
      summary: 执行失败归因并创建缺陷
      operationId: triageRunResult
      parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriageRequest' }
      responses:
        '200': { description: 已归因/已关联, content: { application/json: { schema: { $ref: '#/components/schemas/CaseResult' } } } }
        '201': { description: 已创建缺陷, content: { application/json: { schema: { $ref: '#/components/schemas/CaseResult' } } } }
  /runs/{id}/version-check:
    post:
      summary: 触发版本校验阶段
      operationId: startVersionCheck
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: mismatch 阻断, content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } } }
  /runs/{id}/execute:
    post:
      summary: 执行运行（重跑 attempt 递增）
      operationId: executeRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 已启动, content: { application/json: { schema: { type: object, required: [ run, results ], properties: { run: { $ref: '#/components/schemas/Run' }, results: { type: array, items: { $ref: '#/components/schemas/CaseResult' } } } } } } }
  /runs/{id}/pause:
    post:
      summary: 暂停
      operationId: pauseRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 已暂停, content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } } }
  /runs/{id}/resume:
    post:
      summary: 恢复
      operationId: resumeRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 已恢复, content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } } }
  # ---------- 门禁（trusted，GP1-05） ----------
  /gates/coverage:
    get:
      summary: 覆盖/缺陷门禁
      operationId: evaluateCoverageGate
      parameters:
        - { name: project_id, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: module, in: query, schema: { type: string } }
      responses:
        '200': { description: 门禁结果, content: { application/json: { schema: { $ref: '#/components/schemas/CoverageGateResult' } } } }
  /gates/rules:
    put:
      summary: 装载门禁策略（版本化，策略即代码）
      operationId: upsertGateRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ target_id, scenario_id, rego ]
              properties:
                target_id: { type: integer }
                scenario_id: { type: integer }
                rego: { type: string, description: 声明式策略 JSON 或 Rego }
      responses:
        '200': { description: 已装载（含新版本号）, content: { application/json: { schema: { $ref: '#/components/schemas/GateRule' } } } }
  /gates/evaluate:
    post:
      summary: 门禁判定（pass/fail/blocked，入审计链）
      operationId: evaluateGate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ run_id ]
              properties:
                run_id: { type: integer }
      responses:
        '200':
          description: 判定结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateResult' }
  /gates/results:
    get:
      summary: 运行的门禁判定结果
      operationId: gateResults
      parameters:
        - { name: run_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: 判定列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GateResult' } } } } }
  /audit/events:
    get:
      summary: 查询当前租户可信审计哈希链事件
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200': { description: 审计事件，按时间倒序, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } } } } }
  # ---------- 成本（trusted，GP1-06） ----------
  /cost/record:
    post:
      summary: 成本计量写入（幂等：request_id+biz_point 不双计）
      operationId: recordCost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ request_id, biz_point ]
              properties:
                request_id: { type: string }
                biz_point: { type: string, enum: [ case_generate, case_execute, gate_judge, analysis ] }
                target_id: { type: integer }
                run_id: { type: integer }
                case_id: { type: integer }
                model: { type: string }
                tokens_in: { type: integer }
                tokens_out: { type: integer }
                unit_price: { type: number, description: 每千 token 单价 }
      responses:
        '200':
          description: inserted 是否新落账（false=幂等跳过）
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted: { type: boolean }
  /cost/overview:
    get:
      summary: 成本总览（=Σ明细，按大类 generate/execute）
      operationId: costOverview
      responses:
        '200':
          description: 总览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostOverview'
  /cost/items:
    get:
      summary: 成本明细（按大类/细类筛选）
      operationId: costItems
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [ generate, execute ] } }
        - { name: point, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: 明细列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CostLineItem' } } } } }
  /cost/compare/{caseId}:
    get:
      summary: 单用例成本历史对比（存量持平/递减证明）
      operationId: costCompare
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 该用例各次成本时序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CostLineItem' }
  /cost/prices:
    get:
      summary: 查询模型价目表
      operationId: listCostPrices
      responses:
        '200': { description: 价目列表, content: { application/json: { schema: { type: array, items: { type: object } } } } }
    post:
      summary: 新增模型价目
      operationId: createCostPrice
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [model, input_unit_price, output_unit_price], properties: { model: { type: string }, input_unit_price: { type: number }, output_unit_price: { type: number }, cache_read_unit_price: { type: number }, effective_from: { type: string, format: date-time } } } } }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { type: object } } } }
  # ---------- 报告（trusted，GP1-07） ----------
  /reports/generate:
    post:
      summary: 由运行生成测试报告
      operationId: generateReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ run_id ]
              properties:
                run_id: { type: integer }
                kind: { type: string, enum: [ project, service, case ], description: 默认 service；跨场景合编 P2 }
      responses:
        '200': { description: 已生成报告（含 HTML）, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
  /reports/bundle:
    post:
      summary: 跨场景合编报告（HTML/Markdown）
      operationId: bundleReports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ report_ids ]
              properties:
                report_ids: { type: array, items: { type: integer } }
                format: { type: string, enum: [ html, markdown ], default: html }
      responses:
        '200': { description: 合编报告内容, content: { application/json: { schema: { $ref: '#/components/schemas/ReportBundle' } } } }
  /reports/bundle/export:
    post:
      summary: 导出跨场景合编报告
      operationId: exportBundleReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ report_ids, format ]
              properties:
                report_ids: { type: array, items: { type: integer } }
                format: { type: string, enum: [ pdf, docx ] }
      responses:
        '200':
          description: 二进制报告文件
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: { schema: { type: string, format: binary } }
  /reports/{id}/export:
    get:
      summary: 导出报告
      operationId: exportReport
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: fmt, in: query, schema: { type: string, enum: [ html ], default: html } }
      responses:
        '200':
          description: HTML 报告
          content:
            text/html: {}
  /assistant/sessions:
    post:
      summary: 创建当前用户的 AI 对话会话
      operationId: createAssistantSession
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantSessionCreate' } } } }
      responses:
        '201': { description: 已创建会话, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantSession' } } } }
  /assistant/sessions/{id}/turns:
    get:
      summary: 读取对话会话
      operationId: listAssistantTurns
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200': { description: 对话列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AssistantTurn' } } } } }
    post:
      summary: 发送一条 AI 对话
      operationId: createAssistantTurn
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantTurnCreate' } } } }
      responses:
        '201': { description: 已生成回答, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantTurnResponse' } } } }
  /assistant/sessions/{id}/guidance:
    post:
      summary: 发起一次受限且可见的界面引导
      operationId: startAssistantGuidance
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '201': { description: 动作清单, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AssistantUIAction' } } } } }
  /assistant/sessions/{id}/actions:
    get:
      summary: 查询本会话的界面动作记录
      operationId: listAssistantActions
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200': { description: 动作记录, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AssistantActionRecord' } } } } }
  /assistant/sessions/{id}/actions/{actionId}/complete:
    post:
      summary: 记录用户可见引导动作的完成或取消
      operationId: completeAssistantAction
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: actionId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantActionComplete' } } } }
      responses:
        '201': { description: 完成记录已写入审计链, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantActionRecord' } } } }
  /assistant/artifacts:
    get:
      summary: 查询 AI 协作待处理事项
      operationId: listAssistantArtifacts
      responses:
        '200': { description: 协作事项, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AssistantArtifact' } } } } }
  # ---------- 缺陷中心（governance defect） ----------
  /findings:
    get:
      summary: 缺陷列表（按租户/严重级别/状态/关键字筛选）
      operationId: listFindings
      parameters:
        - { name: x-gp-team-id, in: header, required: true, schema: { type: integer } }
        - { name: severity, in: query, schema: { type: string, enum: [P0, P1, P2, P3] } }
        - { name: status, in: query, schema: { type: string, enum: [candidate, triaged, confirmed, fixing, pending_regression, closed, false_positive] } }
        - { name: module, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: 缺陷列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Finding' } } } } }
        '401': { description: 缺少租户/认证 }
    post:
      summary: 创建缺陷（仓库+冻结提交必填；相同 dedupe_hash 幂等返回已有）
      operationId: createFinding
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FindingCreate' } } }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/Finding' } } } }
        '200': { description: 去重命中，返回已有缺陷, content: { application/json: { schema: { $ref: '#/components/schemas/Finding' } } } }
        '400': { description: 参数校验失败 }
  /findings/{id}/evidence:
    post:
      summary: 登记缺陷证据元数据（文件已在对象存储）
      operationId: createFindingEvidence
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceCreate' } } }
      responses:
        '201': { description: 已登记, content: { application/json: { schema: { $ref: '#/components/schemas/Evidence' } } } }
    get:
      summary: 查询缺陷证据
      operationId: listFindingEvidence
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200': { description: 证据列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Evidence' } } } } }
  /findings/{id}/evidence/{eid}:
    get:
      summary: 查询单条证据
      operationId: getFindingEvidence
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: eid, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 证据, content: { application/json: { schema: { $ref: '#/components/schemas/Evidence' } } } }
  /findings/{id}:
    get:
      summary: 缺陷详情（含流转时间线）
      operationId: getFinding
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200': { description: 缺陷详情, content: { application/json: { schema: { $ref: '#/components/schemas/Finding' } } } }
        '404': { description: 缺陷不存在 }
  /findings/{id}/transition:
    post:
      summary: 缺陷状态流转
      operationId: transitionFinding
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FindingTransition' } } }
      responses:
        '200': { description: 流转后的缺陷, content: { application/json: { schema: { $ref: '#/components/schemas/Finding' } } } }
        '409': { description: 非法状态流转 }
  # ---------- 覆盖账本（governance coverage） ----------
  /coverage/plan:
    post:
      summary: 保存契约端点并生成 Coverage Cell
      operationId: planCoverage
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CoveragePlanRequest' } } }
      responses:
        '201': { description: 计划与汇总, content: { application/json: { schema: { $ref: '#/components/schemas/CoveragePlanResponse' } } } }
        '400': { description: 参数校验失败 }
  /coverage/cells:
    get:
      summary: 查询覆盖账本
      operationId: listCoverageCells
      parameters:
        - { name: project_id, in: query, schema: { type: integer, format: int64 } }
        - { name: service_id, in: query, schema: { type: integer, format: int64 } }
        - { name: module, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [planned, generated, executed, passed, failed, blocked, waived] } }
        - { name: required, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Cell 列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CoverageCell' } } } } }
  /coverage/summary:
    get:
      summary: 覆盖汇总（Design/Execution/Pass 分开）
      operationId: getCoverageSummary
      parameters:
        - { name: project_id, in: query, schema: { type: integer, format: int64 } }
        - { name: module, in: query, schema: { type: string } }
      responses:
        '200': { description: 汇总, content: { application/json: { schema: { $ref: '#/components/schemas/CoverageSummary' } } } }
  /coverage/gaps:
    get:
      summary: 覆盖缺口报告（按模块/维度）
      operationId: getCoverageGaps
      parameters:
        - { name: project_id, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: module, in: query, schema: { type: string } }
      responses:
        '200': { description: 缺口报告, content: { application/json: { schema: { $ref: '#/components/schemas/CoverageGapReport' } } } }
  /coverage/waivers:
    post:
      summary: 为 Coverage Cell 创建显式豁免
      operationId: createCoverageWaivers
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CoverageWaiverCreate' } } }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CoverageWaiver' } } } } }
        '400': { description: 参数校验失败 }
    get:
      summary: 查询覆盖率豁免
      operationId: listCoverageWaivers
      parameters:
        - { name: project_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 豁免列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CoverageWaiver' } } } } }
  /coverage/waivers/{id}:
    delete:
      summary: 撤销覆盖率豁免
      operationId: revokeCoverageWaiver
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '204': { description: 已撤销 }
        '404': { description: 豁免不存在 }
  # ---------- DSH generation jobs (AI) ----------
  /ai/generation-jobs:
    post:
      summary: 创建并提交 DSH 生成 Job
      operationId: createGenerationJob
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GenerationJobCreate' } } }
      responses:
        '202': { description: 已提交, content: { application/json: { schema: { $ref: '#/components/schemas/GenerationJob' } } } }
        '200': { description: 幂等命中已有 Job, content: { application/json: { schema: { $ref: '#/components/schemas/GenerationJob' } } } }
        '400': { description: 参数校验失败或 gateway 未配置 }
  /ai/generation-jobs/{id}:
    get:
      summary: 查询 DSH 生成 Job
      operationId: getGenerationJob
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200': { description: Job 状态, content: { application/json: { schema: { $ref: '#/components/schemas/GenerationJob' } } } }
        '404': { description: Job 不存在 }
    delete:
      summary: 取消 DSH 生成 Job
      operationId: cancelGenerationJob
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '202': { description: 已取消 }
        '409': { description: Job 已终态 }
  /generation/jobs/{id}/cases:import:
    post:
      summary: 导入 DSH 生成 Job 的结构化用例并回填 Coverage Cell
      operationId: importGenerationCases
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ target_id ]
              properties: { target_id: { type: integer, format: int64 } }
      responses:
        '201': { description: 已导入用例, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TestCase' } } } } }
        '400': { description: 输出不是合法用例数组 }
        '409': { description: Job 未成功 }
components:
  schemas:
    GenerationJobCreate:
      type: object
      required: [ project_id, prompt, idempotency_key ]
      properties:
        project_id: { type: integer, format: int64 }
        service_id: { type: integer, format: int64 }
        module: { type: string }
        prompt: { type: string }
        timeout_ms: { type: integer, format: int64, default: 900000 }
        idempotency_key: { type: string }
    GenerationJob:
      type: object
      required: [ id, team_id, project_id, module, state, created_at, updated_at ]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        service_id: { type: integer, format: int64, nullable: true }
        module: { type: string }
        state: { type: string, enum: [queued, running, succeeded, failed, timeout, cancelled] }
        external_job_id: { type: string }
        output: { type: string }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CoverageEndpointInput:
      type: object
      required: [ method, path ]
      properties:
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS] }
        path: { type: string }
        module: { type: string }
        operation_id: { type: string }
        auth_mode: { type: string, enum: [bearer, public, presigned, internal] }
        source_file: { type: string }
        source_line: { type: integer }
    CoveragePlanRequest:
      type: object
      required: [ project_id, endpoints ]
      properties:
        project_id: { type: integer, format: int64 }
        service_id: { type: integer, format: int64 }
        module: { type: string }
        endpoints: { type: array, items: { $ref: '#/components/schemas/CoverageEndpointInput' } }
    CoverageCell:
      type: object
      required: [ id, team_id, project_id, endpoint_hash, method, path, module, dimension, equivalence_class, role, state, required, priority, status ]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        service_id: { type: integer, format: int64, nullable: true }
        endpoint_id: { type: integer, format: int64 }
        endpoint_hash: { type: string }
        method: { type: string }
        path: { type: string }
        module: { type: string }
        dimension: { type: string }
        equivalence_class: { type: string }
        role: { type: string }
        state: { type: string }
        required: { type: boolean }
        priority: { type: string }
        status: { type: string }
        case_id: { type: integer, format: int64, nullable: true }
        waiver_id: { type: integer, format: int64, nullable: true }
    CoverageGapCount:
      type: object
      properties:
        required: { type: integer }
        mapped: { type: integer }
        passed: { type: integer }
        failed: { type: integer }
        blocked: { type: integer }
        unmapped: { type: integer }
    CoverageGapModule:
      allOf:
        - { $ref: '#/components/schemas/CoverageGapCount' }
        - type: object
          properties:
            module: { type: string }
    CoverageGapDimension:
      allOf:
        - { $ref: '#/components/schemas/CoverageGapCount' }
        - type: object
          properties:
            dimension: { type: string }
    CoverageGapReport:
      type: object
      required: [ project_id, total, modules, dimensions ]
      properties:
        project_id: { type: integer, format: int64 }
        module: { type: string }
        total: { $ref: '#/components/schemas/CoverageGapCount' }
        modules: { type: array, items: { $ref: '#/components/schemas/CoverageGapModule' } }
        dimensions: { type: array, items: { $ref: '#/components/schemas/CoverageGapDimension' } }
    CoverageWaiverCreate:
      type: object
      required: [ cell_ids, reason, owner_id ]
      properties:
        cell_ids: { type: array, items: { type: integer, format: int64 }, minItems: 1 }
        reason: { type: string, maxLength: 2000 }
        owner_id: { type: integer, format: int64 }
        expires_at: { type: string, format: date-time, nullable: true }
        evidence: { type: object, additionalProperties: true }
    CoverageWaiver:
      type: object
      required: [ id, cell_id, reason, owner_id, created_at ]
      properties:
        id: { type: integer, format: int64 }
        cell_id: { type: integer, format: int64 }
        reason: { type: string }
        owner_id: { type: integer, format: int64 }
        expires_at: { type: string, format: date-time, nullable: true }
        evidence: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    CoverageSummary:
      type: object
      required: [ total_required, design_covered, executed, passed, waived, uncovered ]
      properties:
        total_required: { type: integer }
        design_covered: { type: integer }
        executed: { type: integer }
        passed: { type: integer }
        waived: { type: integer }
        uncovered: { type: integer }
    CoveragePlanResponse:
      type: object
      required: [ cells, summary ]
      properties:
        cells: { type: array, items: { $ref: '#/components/schemas/CoverageCell' } }
        summary: { $ref: '#/components/schemas/CoverageSummary' }
    CoverageGateResult:
      type: object
      required: [ project_id, module, total_required, design_covered, executed, passed, design_coverage, execution_coverage, open_p0, open_p1, gate_passed, blockers ]
      properties:
        project_id: { type: integer, format: int64 }
        module: { type: string }
        total_required: { type: integer }
        design_covered: { type: integer }
        executed: { type: integer }
        passed: { type: integer }
        design_coverage: { type: number }
        execution_coverage: { type: number }
        open_p0: { type: integer }
        open_p1: { type: integer }
        gate_passed: { type: boolean }
        blockers: { type: array, items: { type: string } }
    EvidenceCreate:
      type: object
      required: [ kind, storage_uri, mime_type, size_bytes, sha256 ]
      properties:
        kind: { type: string, enum: [request, response, log, trace, screenshot, video] }
        storage_uri: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        width: { type: integer }
        height: { type: integer }
        duration_ms: { type: integer }
        sha256: { type: string }
        thumbnail_uri: { type: string }
        redacted: { type: boolean }
    Evidence:
      type: object
      required: [ id, team_id, finding_id, kind, storage_uri, mime_type, size_bytes, sha256, created_by ]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        finding_id: { type: integer, format: int64 }
        kind: { type: string }
        storage_uri: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        duration_ms: { type: integer, nullable: true }
        sha256: { type: string }
        thumbnail_uri: { type: string, nullable: true }
        redacted: { type: boolean }
        created_by: { type: integer, format: int64 }
    FindingRepository:
      type: object
      required: [ name, url, branch, commit_sha ]
      properties:
        id: { type: integer, format: int64, nullable: true }
        name: { type: string }
        url: { type: string }
        branch: { type: string }
        commit_sha: { type: string }
    FindingEvidence:
      type: object
      properties:
        request: { type: string }
        response: { type: string }
        log: { type: string }
        trace: { type: string }
    FindingEvent:
      type: object
      required: [ time, text, actor, action ]
      properties:
        time: { type: string }
        text: { type: string }
        actor: { type: string }
        action: { type: string }
        from: { type: string }
        to: { type: string }
    Finding:
      type: object
      required: [ id, team_id, project_id, repository, module, endpoint, title, severity, category, status, expected, actual, root_cause, impact, confidence, evidence, coverage_cells, owner, dedupe_hash, created_at, updated_at ]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        service_id: { type: integer, format: int64, nullable: true }
        endpoint_id: { type: integer, format: int64, nullable: true }
        target_id: { type: integer, format: int64, nullable: true }
        repository: { $ref: '#/components/schemas/FindingRepository' }
        module: { type: string }
        endpoint: { type: string }
        title: { type: string }
        description: { type: string }
        severity: { type: string, enum: [P0, P1, P2, P3] }
        category: { type: string, enum: [product, case, environment, data, expected_change, flaky] }
        status: { type: string, enum: [candidate, triaged, confirmed, fixing, pending_regression, closed, false_positive] }
        expected: { type: string }
        actual: { type: string }
        root_cause: { type: string }
        impact: { type: string }
        confidence: { type: string, enum: [high, medium, low] }
        source_file: { type: string }
        source_line: { type: integer }
        evidence: { $ref: '#/components/schemas/FindingEvidence' }
        coverage_cells: { type: array, items: { type: string } }
        owner_id: { type: integer, format: int64, nullable: true }
        owner: { type: string }
        linked_run_id: { type: integer, format: int64, nullable: true }
        linked_case_id: { type: integer, format: int64, nullable: true }
        dedupe_hash: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        timeline: { type: array, items: { $ref: '#/components/schemas/FindingEvent' } }
    FindingCreate:
      type: object
      required: [ title, severity, repo_url, commit_sha ]
      properties:
        project_id: { type: integer, format: int64, default: 0 }
        service_id: { type: integer, format: int64 }
        endpoint_id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        repository_id: { type: integer, format: int64 }
        repo_name: { type: string }
        repo_url: { type: string }
        branch: { type: string }
        commit_sha: { type: string }
        module: { type: string }
        endpoint: { type: string }
        title: { type: string }
        description: { type: string }
        severity: { type: string, enum: [P0, P1, P2, P3] }
        category: { type: string, enum: [product, case, environment, data, expected_change, flaky] }
        expected: { type: string }
        actual: { type: string }
        root_cause: { type: string }
        impact: { type: string }
        confidence: { type: string, enum: [high, medium, low] }
        source_file: { type: string }
        source_line: { type: integer }
        evidence: { $ref: '#/components/schemas/FindingEvidence' }
        coverage_cells: { type: array, items: { type: string } }
        owner_id: { type: integer, format: int64 }
        linked_run_id: { type: integer, format: int64 }
        linked_case_id: { type: integer, format: int64 }
    FindingTransition:
      type: object
      required: [ action ]
      properties:
        action: { type: string, enum: [triage, confirm, false_positive, pending_regression, close, reopen] }
        reason: { type: string }
    AssistantSessionCreate:
      type: object
      required: [ page ]
      properties: { page: { type: string, enum: [ /gate, /cases, /exec, /history, /generation, /trace, /target, /scenarios, /assistant ] } }
    AuditEvent:
      type: object
      required: [ id, team_id, actor, op, asset, asset_id, payload, prev_hash, hash, ts ]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        actor: { type: integer, format: int64 }
        op: { type: string }
        asset: { type: string }
        asset_id: { type: integer, format: int64 }
        payload: { type: object, additionalProperties: true }
        prev_hash: { type: string }
        hash: { type: string }
        ts: { type: string, format: date-time }
    AssistantSession:
      type: object
      required: [ id, page, created_at, updated_at ]
      properties:
        id: { type: integer, format: int64 }
        page: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssistantTurnCreate:
      type: object
      required: [ text ]
      properties: { text: { type: string, minLength: 1, maxLength: 4000 } }
    AssistantTurn:
      type: object
      required: [ id, session_id, role, text, created_at ]
      properties:
        id: { type: integer, format: int64 }
        session_id: { type: integer, format: int64 }
        role: { type: string, enum: [ user, assistant ] }
        text: { type: string }
        created_at: { type: string, format: date-time }
    AssistantArtifact:
      type: object
      required: [ id, kind, priority, title, summary, recommendation, evidence, status, created_at ]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string }
        priority: { type: string, enum: [ high, medium, low ] }
        title: { type: string }
        summary: { type: string }
        recommendation: { type: string }
        evidence: { type: array, items: { type: string } }
        status: { type: string, enum: [ open, archived ] }
        created_at: { type: string, format: date-time }
    AssistantTurnResponse:
      type: object
      required: [ user, assistant ]
      properties:
        user: { $ref: '#/components/schemas/AssistantTurn' }
        assistant: { $ref: '#/components/schemas/AssistantTurn' }
        artifact: { $ref: '#/components/schemas/AssistantArtifact', nullable: true }
    AssistantUIAction:
      type: object
      required: [ id, kind, label ]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [ navigate, focus, prefill, open_evidence ] }
        route: { type: string }
        target: { type: string }
        values: { type: object, additionalProperties: { type: string } }
        label: { type: string }
    AssistantActionComplete:
      type: object
      required: [ status ]
      properties: { status: { type: string, enum: [ completed, cancelled ] } }
    AssistantActionRecord:
      type: object
      required: [ id, action, status, created_at ]
      properties:
        id: { type: integer, format: int64 }
        action: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
    WechatAuthConfig:
      type: object
      required: [ team_id, enabled, app_id, callback_uri, secret_configured ]
      properties:
        team_id: { type: integer, format: int64 }
        enabled: { type: boolean }
        app_id: { type: string }
        callback_uri: { type: string }
        secret_configured: { type: boolean }
        updated_at: { type: string, format: date-time }
    WechatAuthConfigInput:
      type: object
      required: [ enabled, app_id, callback_uri ]
      properties:
        enabled: { type: boolean }
        app_id: { type: string }
        app_secret: { type: string, writeOnly: true }
        callback_uri: { type: string }
    WechatBinding:
      type: object
      required: [ bound ]
      properties:
        bound: { type: boolean }
        display_name: { type: string }
        avatar_url: { type: string }
    TeamSummary:
      type: object
      required: [ id, name, member_count, project_count ]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        member_count: { type: integer, format: int64 }
        project_count: { type: integer, format: int64 }
    TeamMember:
      type: object
      required: [ id, principal_id, username, display_name, email, role, status ]
      properties:
        id: { type: integer, format: int64 }
        principal_id: { type: string }
        username: { type: string }
        display_name: { type: string }
        email: { type: string }
        role: { type: string, enum: [ owner, admin, tester, viewer ] }
        status: { type: string, enum: [ active, disabled, invited ] }
        last_active_at: { type: string, format: date-time }
    TeamMemberUpdate:
      type: object
      required: [ role, status ]
      properties:
        role: { type: string, enum: [ owner, admin, tester, viewer ] }
        status: { type: string, enum: [ active, disabled, invited ] }
    TeamAsset:
      type: object
      required: [ id, name, kind, owner_name ]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string }
        owner_id: { type: integer, format: int64 }
        owner_name: { type: string }
    AssetGrant:
      type: object
      required: [ member_id, display_name, email, role, permission, concurrent_quota, sandbox_quota, version ]
      properties:
        member_id: { type: integer, format: int64 }
        display_name: { type: string }
        email: { type: string }
        role: { type: string, enum: [ owner, admin, tester, viewer ] }
        permission: { type: string, enum: [ full, edit, exec, view, none ] }
        concurrent_quota: { type: integer, format: int64, minimum: 0 }
        sandbox_quota: { type: integer, format: int64, minimum: 0 }
        version: { type: integer, format: int64 }
    AssetGrantUpdate:
      type: object
      required: [ permission, concurrent_quota, sandbox_quota ]
      properties:
        permission: { type: string, enum: [ full, edit, exec, view, none ] }
        concurrent_quota: { type: integer, format: int64, minimum: 0 }
        sandbox_quota: { type: integer, format: int64, minimum: 0 }
    ModelProvider:
      type: object
      description: 供应商默认配置；不包含任何内置模型版本
