openapi: 3.0.3
info:
  title: GreenPass 软件测试治理平台 API
  description: |
    测试质量管控平台后端契约（P1）。
    租户隔离：所有业务请求必须携带 `x-gp-team-id` 与可选 `x-gp-user-id` 头，经 RLS 过滤。
    审计哈希链 / 成本明细 / 门禁判定由 trusted 域统一写（口径单点）。
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: 健康检查
      operationId: healthz
      responses:
        '200':
          description: 存活
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /readyz:
    get:
      summary: 就绪检查
      operationId: readyz
      responses:
        '200':
          description: 依赖可用
          content:
            application/json: { schema: { $ref: '#/components/schemas/ReadinessResponse' } }
        '503':
          description: 依赖不可用
          content:
            application/json: { schema: { $ref: '#/components/schemas/ReadinessResponse' } }
  /version:
    get:
      summary: 构建和 API 版本
      operationId: version
      responses:
        '200':
          description: 版本信息
          content:
            application/json: { schema: { $ref: '#/components/schemas/VersionResponse' } }
  /teams/current:
    get:
      summary: 当前登录会话的团队概览
      operationId: currentTeam
      responses:
        '200': { description: 团队概览, content: { application/json: { schema: { $ref: '#/components/schemas/TeamSummary' } } } }
  /auth/wechat/status:
    get:
      summary: 微信登录公开配置状态
      operationId: wechatAuthStatus
      parameters:
        - { name: team_id, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 状态, content: { application/json: { schema: { type: object, required: [configured, enabled], properties: { configured: {type: boolean}, enabled: {type: boolean} } } } } }
  /settings/auth/wechat:
    get:
      summary: 获取微信登录配置
      operationId: getWechatAuthConfig
      responses:
        '200': { description: 配置, content: { application/json: { schema: { $ref: '#/components/schemas/WechatAuthConfig' } } } }
    put:
      summary: 保存微信登录配置
      operationId: saveWechatAuthConfig
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WechatAuthConfigInput' } } } }
      responses:
        '200': { description: 已配置, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
  /account/wechat:
    get:
      summary: 当前账号微信绑定状态
      operationId: getWechatBinding
      responses:
        '200': { description: 绑定状态, content: { application/json: { schema: { $ref: '#/components/schemas/WechatBinding' } } } }
    delete:
      summary: 解绑当前账号微信
      operationId: unbindWechat
      responses:
        '204': { description: 已解绑 }
  /teams/current/members:
    get:
      summary: 当前团队成员
      operationId: listTeamMembers
      responses:
        '200': { description: 成员列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TeamMember' } } } } }
  /teams/current/members/{id}:
    patch:
      summary: 修改当前团队成员角色或状态
      operationId: updateTeamMember
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TeamMemberUpdate' } } } }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '409': { description: 不能降级或停用最后一个拥有者 }
  /teams/current/assets:
    get:
      summary: 当前团队被测对象
      operationId: listTeamAssets
      responses:
        '200': { description: 被测对象列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TeamAsset' } } } } }
  /teams/current/assets/{targetId}/permissions:
    get:
      summary: 被测对象的成员授权
      operationId: listAssetPermissions
      parameters:
        - { name: targetId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 授权列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AssetGrant' } } } } }
  /teams/current/assets/{targetId}/permissions/{memberId}:
    put:
      summary: 设置成员的被测对象权限及配额
      operationId: updateAssetPermission
      parameters:
        - { name: targetId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: memberId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssetGrantUpdate' } } } }
      responses:
        '200': { description: 已更新, content: { application/json: { schema: { $ref: '#/components/schemas/AssetGrant' } } } }
  # ---------- 被测对象（governance，GP1-01） ----------
  /targets:
    get:
      summary: 被测对象树（工程/服务组/服务/模块）
      operationId: listTargets
      parameters:
        - { name: x-gp-team-id, in: header, required: true, schema: { type: integer } }
      responses:
        '200': { description: 树形列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Target' } } } } }
    post:
      summary: 创建被测对象节点
      operationId: createTarget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ name, type ]
              properties:
                name: { type: string }
                remark: { type: string, maxLength: 500 }
                type: { type: string, enum: [ project, service_group, service, module ] }
                parent_id: { type: integer }
                kind: { type: string }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/Target' } } } }
  /targets/{id}/repo:
    post:
      summary: 关联上游仓库（来源溯源）
      operationId: attachRepo
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ url ]
              properties:
                url: { type: string, description: 仓库地址（如 git@github.com:org/repo.git） }
                default_branch: { type: string }
      responses:
        '200': { description: 已关联, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
  /projects/{id}/repositories:
    get:
      summary: 列出项目仓库
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200': { description: 项目仓库, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProjectRepository' } } } } }
  /projects/{id}/repositories:batch:
    post:
      summary: 批量添加项目仓库
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ repositories ], properties: { repositories: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ProjectRepositoryInput' } } } } } }
      responses:
        '207': { description: 逐条处理结果, content: { application/json: { schema: { $ref: '#/components/schemas/BatchResultResponse' } } } }
  /projects/{id}/services:
    get:
      summary: 列出项目目录子服务
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200': { description: 子服务, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProjectService' } } } } }
  /projects/{id}/services:batch:
    post:
      summary: 按仓库目录批量创建子服务
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ services ], properties: { services: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ProjectServiceInput' } } } } } }
      responses:
        '207': { description: 逐条处理结果, content: { application/json: { schema: { $ref: '#/components/schemas/BatchResultResponse' } } } }
  /projects/{id}/services/{serviceId}:
    patch:
      summary: 修改目录子服务类型
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: serviceId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ kind ], properties: { kind: { type: string, enum: [ api_service, gateway, websocket_service, web_app, mobile_app, desktop_app, other ] } } } } }
      responses:
        '200': { description: 已修改, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
  /targets/{id}/model-binding:
    get:
      summary: 查询被测对象模型绑定
      operationId: getModelBinding
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 模型绑定（未配置时为 null）, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ModelBinding' } ], nullable: true } } } }
    put:
      summary: 设置被测对象模型绑定
      operationId: setModelBinding
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelBinding' }
      responses:
        '200': { description: 已设置, content: { application/json: { schema: { $ref: '#/components/schemas/Target' } } } }
  /model-catalog:
    get:
      summary: 查询可接入模型目录与团队已配置模型
      responses:
        '200': { description: 模型目录, content: { application/json: { schema: { $ref: '#/components/schemas/ModelCatalog' } } } }
  /model-connections:
    post:
      summary: 验证并保存团队模型连接
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ModelConnectionInput' } } }
      responses:
        '200': { description: 已验证并保存, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
        '502': { description: 供应商连接失败 }
  # ---------- 用例（governance，GP1-02） ----------
  /cases:
    get:
      summary: 用例列表
      operationId: listCases
      parameters:
        - { name: x-gp-team-id, in: header, required: true, schema: { type: integer } }
        - { name: target_id, in: query, schema: { type: integer } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: 用例列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TestCase' } } } } }
    post:
      summary: 创建用例（版本化首版）
      operationId: createCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ target_id, code, title ]
              properties:
                target_id: { type: integer }
                code: { type: string }
                title: { type: string }
                kind: { type: string }
                script: { description: 用例脚本/数据（执行产物来源） }
      responses:
        '201': { description: 已创建（含版本）, content: { application/json: { schema: { $ref: '#/components/schemas/TestCase' } } } }
  /cases/{id}/versions:
    post:
      summary: 迭代创建用例新版本
      operationId: createCaseVersion
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ script ]
              properties:
                script: { description: 用例脚本/数据 }
                source_repo_id: { type: integer }
                source_branch: { type: string }
      responses:
        '200': { description: 新版本已创建, content: { application/json: { schema: { $ref: '#/components/schemas/TestCase' } } } }
  /cases/{id}/rollback:
    post:
      summary: 用例按版本回退（避免错误分支生成）
      operationId: rollbackCase
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ version ]
              properties:
                version: { type: integer }
      responses:
        '200': { description: 已回退 }
  /cases/{id}/history:
    get:
      summary: 用例版本历史对比
      operationId: caseHistory
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 版本历史, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CaseVersion' } } } } }
  /cases/{id}:
    delete:
      summary: 删除用例
      operationId: deleteCase
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 已删除, content: { application/json: { schema: { $ref: '#/components/schemas/StatusResponse' } } } }
  # ---------- 版本校验（execution，GP1-03） ----------
  /targets/{id}/env/runtime:
    post:
      summary: 登记测试环境运行版本（env_runtime）
      operationId: registerRuntime
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ env, version ]
              properties:
                env: { type: string }
                version: { type: string }
      responses:
        '200': { description: 已登记, content: { application/json: { schema: { $ref: '#/components/schemas/EnvRuntime' } } } }
  /targets/{id}/version-check:
    post:
      summary: 发起版本校验（match/mismatch/unknown）
      operationId: checkVersion
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ env, target_version ]
              properties:
                env: { type: string }
                target_version: { type: string }
      responses:
        '200': { description: 校验结果（mismatch 阻断信号）, content: { application/json: { schema: { $ref: '#/components/schemas/EnvCheck' } } } }
  /targets/{id}/version-checks:
    get:
      summary: 最近版本校验记录
      operationId: recentChecks
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: 记录列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EnvCheck' } } } } }
  # ---------- 运行编排（execution，GP1-04） ----------
  /runs:
    get:
      summary: 测试运行列表
      operationId: listRuns
      parameters:
        - { name: target_id, in: query, schema: { type: integer } }
        - { name: state, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: 运行列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Run' } } } } }
    post:
      summary: 创建测试运行（勾选用例空=全量）
      operationId: createRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ target_id, scenario_id, target_version ]
              properties:
                target_id: { type: integer }
                scenario_id: { type: integer }
                env: { type: string }
                target_version: { type: string }
                target_branch: { type: string }
                selected_case_ids: { type: array, items: { type: integer }, description: 空=全量 }
      responses:
        '201': { description: 已创建（queued）, content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } } }
  /runs/{id}:
    get:
      summary: 运行详情（状态机）
      operationId: getRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 运行聚合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
  /runs/{id}/events:
    get:
      summary: 运行状态 SSE 事件流
      operationId: runEvents
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 运行状态事件流；每条 data 为 Run
          content:
            text/event-stream:
              schema: { type: string }
  /runs/{id}/case-results:
    get:
      summary: 运行内用例结果
      operationId: runCaseResults
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 用例结果列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CaseResult' } } } } }
  /runs/{id}/version-check:
    post:
      summary: 触发版本校验阶段
      operationId: startVersionCheck
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: mismatch 阻断, content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } } }
  /runs/{id}/execute:
    post:
      summary: 执行运行（重跑 attempt 递增）
      operationId: executeRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 已启动, content: { application/json: { schema: { type: object, required: [ run, results ], properties: { run: { $ref: '#/components/schemas/Run' }, results: { type: array, items: { $ref: '#/components/schemas/CaseResult' } } } } } } }
  /runs/{id}/pause:
    post:
      summary: 暂停
      operationId: pauseRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 已暂停, content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } } }
  /runs/{id}/resume:
    post:
      summary: 恢复
      operationId: resumeRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 已恢复, content: { application/json: { schema: { $ref: '#/components/schemas/Run' } } } }
  # ---------- 门禁（trusted，GP1-05） ----------
  /gates/rules:
    put:
      summary: 装载门禁策略（版本化，策略即代码）
      operationId: upsertGateRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ target_id, scenario_id, rego ]
              properties:
                target_id: { type: integer }
                scenario_id: { type: integer }
                rego: { type: string, description: 声明式策略 JSON 或 Rego }
      responses:
        '200': { description: 已装载（含新版本号）, content: { application/json: { schema: { $ref: '#/components/schemas/GateRule' } } } }
  /gates/evaluate:
    post:
      summary: 门禁判定（pass/fail/blocked，入审计链）
      operationId: evaluateGate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ run_id ]
              properties:
                run_id: { type: integer }
      responses:
        '200':
          description: 判定结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateResult' }
  /gates/results:
    get:
      summary: 运行的门禁判定结果
      operationId: gateResults
      parameters:
        - { name: run_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: 判定列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GateResult' } } } } }
  # ---------- 成本（trusted，GP1-06） ----------
  /cost/record:
    post:
      summary: 成本计量写入（幂等：request_id+biz_point 不双计）
      operationId: recordCost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ request_id, biz_point ]
              properties:
                request_id: { type: string }
                biz_point: { type: string, enum: [ case_generate, case_execute, gate_judge, analysis ] }
                target_id: { type: integer }
                run_id: { type: integer }
                case_id: { type: integer }
                model: { type: string }
                tokens_in: { type: integer }
                tokens_out: { type: integer }
                unit_price: { type: number, description: 每千 token 单价 }
      responses:
        '200':
          description: inserted 是否新落账（false=幂等跳过）
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted: { type: boolean }
  /cost/overview:
    get:
      summary: 成本总览（=Σ明细，按大类 generate/execute）
      operationId: costOverview
      responses:
        '200':
          description: 总览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostOverview'
  /cost/items:
    get:
      summary: 成本明细（按大类/细类筛选）
      operationId: costItems
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [ generate, execute ] } }
        - { name: point, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: 明细列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CostLineItem' } } } } }
  /cost/compare/{caseId}:
    get:
      summary: 单用例成本历史对比（存量持平/递减证明）
      operationId: costCompare
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 该用例各次成本时序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CostLineItem' }
  # ---------- 报告（trusted，GP1-07） ----------
  /reports/generate:
    post:
      summary: 由运行生成测试报告
      operationId: generateReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ run_id ]
              properties:
                run_id: { type: integer }
                kind: { type: string, enum: [ project, service, case ], description: 默认 service；跨场景合编 P2 }
      responses:
        '200': { description: 已生成报告（含 HTML）, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
  /reports/bundle:
    post:
      summary: 跨场景合编报告（HTML/Markdown）
      operationId: bundleReports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ report_ids ]
              properties:
                report_ids: { type: array, items: { type: integer } }
                format: { type: string, enum: [ html, markdown ], default: html }
      responses:
        '200': { description: 合编报告内容, content: { application/json: { schema: { $ref: '#/components/schemas/ReportBundle' } } } }
  /reports/bundle/export:
    post:
      summary: 导出跨场景合编报告
      operationId: exportBundleReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ report_ids, format ]
              properties:
                report_ids: { type: array, items: { type: integer } }
                format: { type: string, enum: [ pdf, docx ] }
      responses:
        '200':
          description: 二进制报告文件
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: { schema: { type: string, format: binary } }
  /reports/{id}/export:
    get:
      summary: 导出报告
      operationId: exportReport
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: fmt, in: query, schema: { type: string, enum: [ html ], default: html } }
      responses:
        '200':
          description: HTML 报告
          content:
            text/html: {}
components:
  schemas:
    WechatAuthConfig:
      type: object
      required: [ team_id, enabled, app_id, callback_uri, secret_configured ]
      properties:
        team_id: { type: integer, format: int64 }
        enabled: { type: boolean }
        app_id: { type: string }
        callback_uri: { type: string }
        secret_configured: { type: boolean }
        updated_at: { type: string, format: date-time }
    WechatAuthConfigInput:
      type: object
      required: [ enabled, app_id, callback_uri ]
      properties:
        enabled: { type: boolean }
        app_id: { type: string }
        app_secret: { type: string, writeOnly: true }
        callback_uri: { type: string }
    WechatBinding:
      type: object
      required: [ bound ]
      properties:
        bound: { type: boolean }
        display_name: { type: string }
        avatar_url: { type: string }
    TeamSummary:
      type: object
      required: [ id, name, member_count, project_count ]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        member_count: { type: integer, format: int64 }
        project_count: { type: integer, format: int64 }
    TeamMember:
      type: object
      required: [ id, principal_id, username, display_name, email, role, status ]
      properties:
        id: { type: integer, format: int64 }
        principal_id: { type: string }
        username: { type: string }
        display_name: { type: string }
        email: { type: string }
        role: { type: string, enum: [ owner, admin, tester, viewer ] }
        status: { type: string, enum: [ active, disabled, invited ] }
        last_active_at: { type: string, format: date-time }
    TeamMemberUpdate:
      type: object
      required: [ role, status ]
      properties:
        role: { type: string, enum: [ owner, admin, tester, viewer ] }
        status: { type: string, enum: [ active, disabled, invited ] }
    TeamAsset:
      type: object
      required: [ id, name, kind, owner_name ]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string }
        owner_id: { type: integer, format: int64 }
        owner_name: { type: string }
    AssetGrant:
      type: object
      required: [ member_id, display_name, email, role, permission, concurrent_quota, sandbox_quota, version ]
      properties:
        member_id: { type: integer, format: int64 }
        display_name: { type: string }
        email: { type: string }
        role: { type: string, enum: [ owner, admin, tester, viewer ] }
        permission: { type: string, enum: [ full, edit, exec, view, none ] }
        concurrent_quota: { type: integer, format: int64, minimum: 0 }
        sandbox_quota: { type: integer, format: int64, minimum: 0 }
        version: { type: integer, format: int64 }
    AssetGrantUpdate:
      type: object
      required: [ permission, concurrent_quota, sandbox_quota ]
      properties:
        permission: { type: string, enum: [ full, edit, exec, view, none ] }
        concurrent_quota: { type: integer, format: int64, minimum: 0 }
        sandbox_quota: { type: integer, format: int64, minimum: 0 }
    ModelPreset:
      type: object
      required: [ Provider, Name, ModelKey, Protocol, BaseURL, Capabilities ]
      properties:
        Provider: { type: string }
        Name: { type: string }
        ModelKey: { type: string }
        Protocol: { type: string, enum: [ api, cc ] }
        BaseURL: { type: string }
        Capabilities: { type: array, items: { type: string } }
    ConfiguredModel:
      type: object
      required: [ id, provider, model_key, status ]
      properties:
        id: { type: integer, format: int64 }
        provider: { type: string }
        model_key: { type: string }
        status: { type: string }
    ModelCatalog:
      type: object
      required: [ presets, models ]
      properties:
        presets: { type: array, items: { $ref: '#/components/schemas/ModelPreset' } }
        models: { type: array, items: { $ref: '#/components/schemas/ConfiguredModel' } }
    ModelConnectionInput:
      type: object
      required: [ provider, protocol, token, model_keys ]
      properties:
        provider: { type: string }
        protocol: { type: string, enum: [ api, cc ] }
        token: { type: string, minLength: 1, writeOnly: true }
        base_url: { type: string }
        model_keys: { type: array, minItems: 1, items: { type: string } }
    ReadinessResponse:
      type: object
      required: [ status, checks ]
      properties:
        status: { type: string, enum: [ ready, not_ready ] }
        checks: { type: object, additionalProperties: { type: string } }
    VersionResponse:
      type: object
      required: [ version, commit, built_at, api_version ]
      properties:
        version: { type: string }
        commit: { type: string }
        built_at: { type: string }
        api_version: { type: string }
    StatusResponse:
      type: object
      required: [ status ]
      properties:
        status: { type: string }
    Target:
      type: object
      required: [ id, team_id, type, name, kind, status ]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        type: { type: string }
        name: { type: string }
        remark: { type: string }
        kind: { type: string }
        status: { type: string }
        parent_id: { type: integer, format: int64, nullable: true }
        model_binding: { $ref: '#/components/schemas/ModelBinding' }
    ProjectRepository:
      type: object
      required: [ id, project_id, url, default_branch ]
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        url: { type: string }
        default_branch: { type: string }
    ProjectRepositoryInput:
      type: object
      required: [ url ]
      properties:
        url: { type: string }
        default_branch: { type: string, default: main }
    ProjectService:
      type: object
      required: [ id, project_id, repo_id, name, source_path, kind, build_context, status ]
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        repo_id: { type: integer, format: int64 }
        name: { type: string }
        source_path: { type: string }
        kind: { type: string, enum: [ api_service, gateway, websocket_service, web_app, mobile_app, desktop_app, other ] }
        build_context: { type: string }
        dockerfile_path: { type: string, nullable: true }
        manifest_path: { type: string, nullable: true }
        status: { type: string }
    ProjectServiceInput:
      type: object
      required: [ repo_id, name, source_path ]
      properties:
        repo_id: { type: integer, format: int64 }
        name: { type: string }
        source_path: { type: string }
        kind: { type: string, enum: [ api_service, gateway, websocket_service, web_app, mobile_app, desktop_app, other ] }
        build_context: { type: string }
        dockerfile_path: { type: string, nullable: true }
        manifest_path: { type: string, nullable: true }
    BatchResultResponse:
      type: object
      required: [ results ]
      properties:
        results:
          type: array
          items:
            type: object
            required: [ index ]
            properties:
              index: { type: integer }
              id: { type: integer, format: int64 }
              error: { type: string }
    ModelBinding:
      type: object
      required: [ model, provider ]
      properties:
        model: { type: string }
        provider: { type: string }
        params: { type: object, additionalProperties: { type: string } }
    TestCase:
      type: object
      required: [ id, team_id, target_id, code, title, kind, current_version, status ]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        code: { type: string }
        title: { type: string }
        kind: { type: string }
        current_version: { type: integer }
        status: { type: string }
    CaseVersion:
      type: object
      required: [ id, team_id, case_id, version, change_type, created_by, created_at ]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        case_id: { type: integer, format: int64 }
        version: { type: integer }
        change_type: { type: string }
        source_repo_id: { type: integer, format: int64, nullable: true }
        source_branch: { type: string, nullable: true }
        script: { description: 用例脚本/数据 }
        created_by: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    Run:
      type: object
      required: [ id, team_id, scenario_id, target_id, env, target_version, target_branch, env_version, run_mode, state, selected_cases ]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        scenario_id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        env: { type: string }
        target_version: { type: string }
        target_branch: { type: string }
        env_version: { type: string }
        env_check_id: { type: integer, format: int64, nullable: true }
        run_mode: { type: string }
        state: { type: string, enum: [ queued, version_check, scheduled, running, paused, collect, gate, report, done, failed ] }
        selected_cases: { type: array, items: { type: integer, format: int64 } }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
    CaseResult:
      type: object
      required: [ id, team_id, run_id, case_id, case_version, status, result_text, attempt_seq ]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        run_id: { type: integer, format: int64 }
        case_id: { type: integer, format: int64 }
        case_version: { type: integer }
        status: { type: string, enum: [ pass, fail, blocked, skipped, retried ] }
        result_text: { type: string }
        evidence: { type: object, additionalProperties: true, nullable: true }
        attempt_seq: { type: integer }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
    Report:
      type: object
      required: [ id, team_id, run_id, target_id, kind, title, version, branch, scenario, status, summary, html, created_at ]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        run_id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        kind: { type: string }
        title: { type: string }
        version: { type: string }
        branch: { type: string }
        scenario: { type: string }
        status: { type: string }
        summary: { type: object, additionalProperties: true }
        evidence: { type: object, additionalProperties: true }
        html: { type: string }
        created_at: { type: string, format: date-time }
    ReportBundle:
      type: object
      required: [ reports, total, pass, fail ]
      properties:
        reports: { type: array, items: { $ref: '#/components/schemas/Report' } }
        total: { type: integer }
        pass: { type: integer }
        fail: { type: integer }
        html: { type: string }
        markdown: { type: string }
    CostOverview:
      type: object
      required: [ total_amount, by_category, by_point ]
      properties:
        total_amount: { type: number }
        by_category: { type: object, additionalProperties: { type: number } }
        by_point: { type: object, additionalProperties: { type: number } }
    CostLineItem:
      type: object
      required: [ id, request_id, idempotency_key, team_id, target_id, run_id, case_id, category, biz_point, model, tokens_in, tokens_out, unit_price, amount, occurred_at ]
      properties:
        id: { type: integer, format: int64 }
        request_id: { type: string }
        idempotency_key: { type: string }
        team_id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        run_id: { type: integer, format: int64 }
        case_id: { type: integer, format: int64 }
        category: { type: string }
        biz_point: { type: string }
        model: { type: string }
        tokens_in: { type: integer, format: int64 }
        tokens_out: { type: integer, format: int64 }
        unit_price: { type: number }
        amount: { type: number }
        occurred_at: { type: string, format: date-time }
    GateResult:
      type: object
      required: [ id, team_id, run_id, rule_id, result, decided_at ]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        run_id: { type: integer, format: int64 }
        rule_id: { type: integer, format: int64 }
        result: { type: string, enum: [ pass, fail, blocked ] }
        detail: { type: object, additionalProperties: true }
        decided_at: { type: string, format: date-time }
    GateRule:
      type: object
      required: [ id, team_id, target_id, scenario_id, rego, version, enabled ]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        scenario_id: { type: integer, format: int64 }
        rego: { type: string }
        version: { type: integer }
        enabled: { type: boolean }
    EnvRuntime:
      type: object
      required: [ id, team_id, target_id, env, running_version, checked_at ]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        env: { type: string }
        running_version: { type: string }
        checked_at: { type: string, format: date-time }
    EnvCheck:
      type: object
      required: [ id, team_id, target_id, target_version, env_version, result, checked_at ]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        run_id: { type: integer, format: int64, nullable: true }
        target_id: { type: integer, format: int64 }
        target_version: { type: string }
        env_version: { type: string }
        result: { type: string, enum: [ match, mismatch, unknown ] }
        checked_at: { type: string, format: date-time }
  securitySchemes:
    teamHeader:
      type: apiKey
      in: header
      name: x-gp-team-id
security:
  - teamHeader: []
