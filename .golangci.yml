version: "2"
linters:
  enable:
    - depguard
    - gocyclo
    - gosec
    - revive
  settings:
    depguard:
      rules:
        application-no-orm:
          files:
            - '**/internal/*/application/**'
          deny:
            - pkg: gorm.io/gorm
              desc: application 禁 ORM（领域无 ORM）
            - pkg: go.temporal.io/sdk
              desc: application 禁 Temporal SDK（工作流只在 infra/workflow）
        domain-zero-thirdparty:
          files:
            - '**/internal/*/domain/**'
          allow:
            - $gostd
            - github.com/openware-io/open-green-pass/pkg
    gocyclo:
      min-complexity: 15
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - node_modules
      - dist
      - design
      - public
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - node_modules
      - dist
      - design
      - public
      - third_party$
      - builtin$
      - examples$
