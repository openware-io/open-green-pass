name: Feature request
description: 提交一个功能 / 设计建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 需求背景
      description: 你希望解决的问题或场景是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你设想的实现 / 交互 / 设计方向。
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充说明
      description: 相关的截图、示例、参考等。
    validations:
      required: false